name: Demo isolation

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  demo-isolation:
    name: demo-isolation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reject demo code in normal branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import json
          import os
          from urllib.parse import quote
          from urllib.request import Request, urlopen

          DEMO_COMMIT = "26e8f9e5074c679fdefcf05f6793b3a752c73a5b"
          RESERVED = {
              "DEMO_ONLY_DO_NOT_MERGE.md",
              "docs/全流程演示操作指南.md",
              "server/app/demo_fixture.py",
              "server/app/recording_demo.py",
              "server/run_recording_demo.py",
              "server/tests/recording-reports-regression.cjs",
              "server/tests/test_recording_demo.py",
              "start_recording_demo.bat",
              "web/prototype/recording-demo.css",
              "web/prototype/recording-demo.js",
              "web/prototype/recording-reports.css",
              "web/prototype/recording-reports.js",
          }
          GUARD = ".github/workflows/demo-isolation.yml"

          def require(condition, message):
              if not condition:
                  raise RuntimeError(message)

          def api(path):
              request = Request(os.environ["GITHUB_API_URL"] + path, headers={
                  "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              })
              with urlopen(request, timeout=30) as response:
                  return json.load(response)

          def repo_path(name):
              return "/repos/" + "/".join(quote(part, safe="") for part in name.split("/"))

          def check(pull, base_repo):
              head = pull["head"]
              require(not head["ref"].lower().startswith("demo/"),
                      "Demo branches must never be merged into normal code.")
              head_sha = head["sha"]
              head_repo = repo_path(head["repo"]["full_name"])
              tree = api(head_repo + "/git/trees/" + quote(head_sha, safe="") + "?recursive=1")
              require(not tree.get("truncated", True), "Head tree is incomplete; review cannot pass.")
              paths = {item["path"] for item in tree["tree"]}
              require(not paths.intersection(RESERVED), "Head contains reserved demo files.")
              guard_blobs = [item["sha"] for item in tree["tree"]
                             if item["path"] == GUARD and item["type"] == "blob"]
              trusted_guard = api(base_repo + "/contents/" + GUARD
                                  + "?ref=" + quote(os.environ["GITHUB_SHA"], safe=""))
              require(guard_blobs == [trusted_guard["sha"]],
                      "PR must preserve the trusted isolation guard.")
              comparison = api(base_repo + "/compare/" + DEMO_COMMIT + "..." + quote(head_sha, safe=""))
              require(comparison["merge_base_commit"]["sha"] != DEMO_COMMIT,
                      "Head includes the isolated demo commit.")
              count = pull["changed_files"]
              require(count <= 3000, "PR file list exceeds GitHub's complete-list limit.")
              files = []
              for page in range(1, (count + 99) // 100 + 1):
                  files.extend(api(base_repo + "/pulls/" + str(pull["number"])
                                   + "/files?per_page=100&page=" + str(page)))
              require(len(files) == count, "PR file list changed or is incomplete.")
              changed = {name for item in files for name in
                         (item["filename"], item.get("previous_filename")) if name}
              require(not changed.intersection(RESERVED), "PR changes reserved demo files.")

          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as stream:
              event = json.load(stream)
          base_repo = repo_path(os.environ["GITHUB_REPOSITORY"])
          current = api(base_repo + "/pulls/" + str(event["number"]))
          require(current["head"]["sha"] == event["pull_request"]["head"]["sha"],
                  "PR head changed; wait for the latest check.")
          check(current, base_repo)
          latest = api(base_repo + "/pulls/" + str(event["number"]))
          require((latest["head"]["sha"], latest["head"]["ref"], latest["base"]["ref"])
                  == (current["head"]["sha"], current["head"]["ref"], current["base"]["ref"]),
                  "PR changed during inspection; wait for the latest check.")
          print("PASS: normal-code PR contains no reserved demo branch, files, or commit ancestry.")
